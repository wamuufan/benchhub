id = "cray"
name = "C-Ray Raytracing"
category = "Render"
download_size = "~10 KB"
description = "Multi-threaded raytracing rendering benchmark written in pure C."
download_cmd = "wget --progress=bar:force:noscroll -c https://github.com/jtsiomb/c-ray/releases/download/c-ray-1.1/c-ray-1.1.tar.gz && tar --no-same-owner --no-same-permissions --no-xattrs --no-acls --exclude='x86*' -xzf c-ray-1.1.tar.gz --strip-components=1 && rm -f c-ray-1.1.tar.gz && gcc -O3 -pthread c-ray-mt.c -lm -o c-ray"
run_cmd = "./c-ray"
run_args = ["-i", "sphfract", "-s", "1920x1080", "-r", "8", "-o", "/dev/null"]
score_regex = "Rendering took:.*?\\((\\d+)\\s+milliseconds\\)"
score_unit = "ms (lower is better)"
default_version = "1080p"

