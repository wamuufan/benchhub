id = "ycruncher"
name = "y-cruncher"
category = "İşlemci (CPU)"
download_size = "~35 MB"
description = "Yüksek hassasiyetli Pi ve sabit hesaplama stres testi (AVX2/AVX512)."
default_version = "500M"
score_regex = "Total Computation Time:[^\\d]*([0-9\\.]+)"
score_unit = "Saniye (düşük=iyi)"
run_cmd = "./y-cruncher"
run_args = ["pause:0", "skip-warnings", "bench", "500m", "-od:0"]
download_cmd = "wget -q --show-progress -c https://github.com/Mysticial/y-cruncher/releases/download/v0.8.7.9547/y-cruncher.v0.8.7.9547-static.tar.xz -O ycruncher.tar.xz && tar -xf ycruncher.tar.xz --strip-components=1 && rm -f ycruncher.tar.xz && ln -sf y-cruncher ycruncher && chmod +x y-cruncher ycruncher"

