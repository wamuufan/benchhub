id = "ffmpeg"
name = "FFmpeg Video Encoding"
category = "CPU Render"
download_size = "~40 MB"
description = "Multi-threaded H.264, H.265, and AV1 video transcoding and encoding benchmark."
default_version = "Latest Release"
score_regex = "fps=\\s*([\\d\\.]+)"
score_unit = "fps"
run_cmd = "./ffmpeg"
run_args = ["-y", "-f", "lavfi", "-i", "testsrc2=duration=15:size=1920x1080:rate=60", "-c:v", "libx264", "-preset", "medium", "-crf", "23", "-f", "null", "-"]
download_cmd = "wget --progress=bar:force:noscroll -c https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz && tar --no-same-owner --no-same-permissions --no-xattrs --no-acls -xf ffmpeg-release-amd64-static.tar.xz --strip-components=1 --wildcards '*/ffmpeg' && rm -f ffmpeg-release-amd64-static.tar.xz && chmod +x ffmpeg"

