id = "geekbench"
name = "Geekbench"
category = "System & CPU"
download_size = "~375 MB"
description = "Measures single-core and multi-core system performance across real-world workloads."
download_cmd = "wget --progress=bar:force:noscroll -c https://cdn.geekbench.com/Geekbench-7.0.0-Linux.tar.gz && tar --no-same-owner --no-same-permissions -xvzf Geekbench-7.0.0-Linux.tar.gz --strip-components=1 && rm -f Geekbench-7.0.0-Linux.tar.gz"
run_cmd = "./geekbench7"
run_args = ["--upload"]
score_regex = "(?:Single-Core|Multi-Core|Compute|OpenCL|Vulkan) Score\\s+(\\d+)"
score_unit = "Points"
default_version = "7.0.0"

