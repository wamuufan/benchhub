id = "furmark"
name = "Geeks3D FurMark GPU Stress Test"
category = "GPU Stress"
test_type = "stress"
download_size = "~15 MB"
description = "Industry-standard OpenGL and Vulkan GPU thermal and stability stress test (FurMark Donut)."
default_version = "vulkan"
score_regex = "(?i)SCORE\\s*:\\s*([0-9]+)"
score_unit = "Points"
run_cmd = "./furmark_runner"
run_args = ["--demo", "furmark-vk", "--width", "1920", "--height", "1080", "--no-osi"]
download_cmd = "wget --progress=bar:force:noscroll -c https://gpumagick.com/downloads/files/2025/fm2/FurMark_2.7.0.0_linux64.7z -O furmark.7z && ((command -v 7zz >/dev/null 2>&1 && 7zz x -y furmark.7z) || 7z x -y furmark.7z) && rm -f furmark.7z && if [ -s /app/lib/libGLU.so.1 ]; then cp -L /app/lib/libGLU.so.1 FurMark_linux64/dylibs/libGLU.so.1 2>/dev/null || true; elif [ -s \"$HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/ubuntu12_32/steam-runtime/usr/lib/x86_64-linux-gnu/libGLU.so.1\" ]; then cp -L \"$HOME/.var/app/com.valvesoftware.Steam/.local/share/Steam/ubuntu12_32/steam-runtime/usr/lib/x86_64-linux-gnu/libGLU.so.1\"* FurMark_linux64/dylibs/ 2>/dev/null || true; elif [ ! -s /usr/lib64/libGLU.so.1 ] && [ ! -s /usr/lib/x86_64-linux-gnu/libGLU.so.1 ] && command -v ar >/dev/null 2>&1; then wget -nv -q https://mirrors.edge.kernel.org/ubuntu/pool/main/libg/libglu/libglu1-mesa_9.0.2-1.1build1_amd64.deb -O glu.deb 2>/dev/null && ar p glu.deb data.tar.zst 2>/dev/null | tar --zstd -xf - ./usr/lib/x86_64-linux-gnu/libGLU.so.1.3.1 -O > FurMark_linux64/dylibs/libGLU.so.1.tmp 2>/dev/null && if [ -s FurMark_linux64/dylibs/libGLU.so.1.tmp ]; then mv -f FurMark_linux64/dylibs/libGLU.so.1.tmp FurMark_linux64/dylibs/libGLU.so.1; else rm -f FurMark_linux64/dylibs/libGLU.so.1.tmp; fi; rm -f glu.deb; fi && printf '#!/bin/sh\\nDIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\\ncd \"$DIR/FurMark_linux64\" || exit 1\\nexport LD_LIBRARY_PATH=\"$DIR/FurMark_linux64/dylibs:$DIR/FurMark_linux64:/app/lib:$LD_LIBRARY_PATH\"\\nexec ./furmark \"$@\"\\n' > furmark_runner && chmod +x furmark_runner"

