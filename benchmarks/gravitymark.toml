id = "gravitymark"
name = "GravityMark GPU Benchmark"
category = "GPU"
download_size = "~190 MB"
description = "Cross-API GPU stress and raytracing benchmark using Vulkan and OpenGL."
default_version = "vulkan"
score_regex = "(?i)Score:\\s*([0-9]+)"
score_unit = "Points"
run_cmd = "./gravitymark"
run_args = ["-temporal", "1", "-close", "1", "-sensors", "1", "-benchmark", "1", "-vk"]
download_cmd = "wget --progress=bar:force:noscroll -c https://tellusim.com/download/GravityMark_1.89.run -O gravitymark.run && chmod +x gravitymark.run && export TAR_OPTIONS='--no-same-owner --no-same-permissions' && ./gravitymark.run --tar -xf && rm -f gravitymark.run && printf '#!/bin/sh\\nDIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\\ncd \"$DIR/bin\" || exit 1\\nexport LD_LIBRARY_PATH=\"$DIR/bin:$LD_LIBRARY_PATH\"\\necho \"\" | ./GravityMark.x64 \"$@\"\\n' > gravitymark && chmod +x gravitymark"

