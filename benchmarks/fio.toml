id = "fio"
name = "FIO"
category = "Storage"
download_size = "~1.5 MB"
description = "Industry-standard storage I/O benchmark measuring read and write performance across NVMe, SSD, and HDD."
default_version = "Seq-Read"
score_regex = "(?:bw|BW)=([0-9\\.]+)(?:MiB/s|MB/s)"
score_unit = "MB/s"
run_cmd = "./fio"
run_args = ["--name=seq_read", "--size=512M", "--rw=read", "--bs=1M", "--direct=1", "--ioengine=sync", "--time_based", "--runtime=15", "--unlink=1", "--filename=benchhub_fio_testfile"]
download_cmd = "([ -n \"$SNAP\" ] || [ -n \"$FLATPAK_ID\" ] || [ -f /.flatpak-info ]) && command -v fio >/dev/null 2>&1 && fio --version >/dev/null 2>&1 || (command -v fio >/dev/null 2>&1 && fio --version >/dev/null 2>&1 && cp $(command -v fio) ./fio && chmod +x fio) || (wget --progress=bar:force:noscroll -c https://github.com/axboe/fio/archive/refs/tags/fio-3.38.tar.gz -O fio-3.38.tar.gz && tar --no-same-owner --no-same-permissions --no-xattrs --no-acls -xzf fio-3.38.tar.gz && cd fio-fio-3.38 && ./configure --disable-gfapi --disable-numa --disable-pmem --disable-rados --disable-rbd --disable-rdma > /dev/null && make -j$(nproc) fio > /dev/null && cp fio ../fio && cd .. && rm -rf fio-fio-3.38 fio-3.38.tar.gz && chmod +x fio)"

