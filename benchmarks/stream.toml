id = "stream"
name = "STREAM"
category = "Memory"
download_size = "~50 KB"
description = "Sustainable memory bandwidth benchmark (Triad, Copy, Scale, Add)."
default_version = "Standard"
score_regex = "Triad:\\s*([0-9\\.]+)"
score_unit = "MB/s"
run_cmd = "./stream"
run_args = []
download_cmd = "(wget --progress=bar:force:noscroll -c https://raw.githubusercontent.com/jeffhammond/STREAM/master/stream.c -O stream.c || wget --progress=bar:force:noscroll -c https://www.cs.virginia.edu/stream/FTP/Code/stream.c -O stream.c) && (if command -v gcc >/dev/null 2>&1; then gcc -O3 -fopenmp -DSTREAM_ARRAY_SIZE=80000000 -DNTIMES=10 stream.c -o stream; elif [ -x /app/bin/stream-standard ]; then cp -f /app/bin/stream-standard ./stream; else exit 127; fi) && chmod +x stream"

