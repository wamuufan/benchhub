id = "stream"
name = "STREAM"
category = "Bellek"
download_size = "~50 KB"
description = "Sürdürülebilir bellek bant genişliği (Triad, Copy, Scale, Add) ölçüm testi."
default_version = "Standard"
score_regex = "Triad:\\s*([0-9\\.]+)"
score_unit = "MB/s"
run_cmd = "./stream"
run_args = []
download_cmd = "(wget -q  -c https://raw.githubusercontent.com/jeffhammond/STREAM/master/stream.c -O stream.c || wget -q  -c https://www.cs.virginia.edu/stream/FTP/Code/stream.c -O stream.c) && gcc -O3 -fopenmp -DSTREAM_ARRAY_SIZE=80000000 -DNTIMES=10 stream.c -o stream && chmod +x stream"

