app-id: org.benchhub.BenchHub
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: benchhub
modules:
  - name: benchhub
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/benchhub /app/bin/benchhub
    sources:
      - type: dir
        path: ../../
