app-id: org.benchhub.BenchHub
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: benchhub

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=xdg-run/dconf
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/benchhub/cargo

modules:
  - name: benchhub
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/benchhub /app/bin/benchhub
    sources:
      - type: dir
        path: ../../
