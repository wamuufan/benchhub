name: benchhub
base: core22
version: '0.1.0'
summary: BenchHub Benchmark Manager
description: A central place for benchmarks.
grade: stable
confinement: strict

parts:
  benchhub:
    plugin: rust
    source: .
    build-packages:
      - build-essential
      - libsqlite3-dev
      - pkg-config
      - libfontconfig1-dev
      - libx11-dev
      - libxkbcommon-dev

apps:
  benchhub:
    command: bin/benchhub
    plugs:
      - opengl
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - home
      - network
      - hardware-observe
